services:
  postgres-test:
    image: postgres:16-alpine
    container_name: nestjs-starter-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nestjs_test_db
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data

  redis-test:
    image: redis:7-alpine
    container_name: nestjs-starter-redis-test
    ports:
      - '6380:6379'
